name: Build shared documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet fsi build.fsx -- verify --report .artifacts/verification.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-report
          path: |
            playwright-report
            test-results
            .artifacts/verification.json
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site-and-provenance
          path: |
            output
            .generated/site.json
            .artifacts/verification.json
      - uses: actions/upload-pages-artifact@v5
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        with:
          path: output
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
